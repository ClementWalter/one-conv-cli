# Claude Desktop extension: a v* tag publishes one-conv-cli.mcpb on its GitHub release.
# release.yml dispatches this on the tag it creates for every shipped change on main (a tag
# pushed with the workflow token starts no push run); a tag pushed by hand runs it directly.
name: extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    permissions:
      contents: write
    uses: ClementWalter/mcp-bridge/.github/workflows/extension.yml@cf5a483580ee20a80f4275112c5ecaad4e6eed83
    with:
      launcher: bin/one-conv
      bridge-ref: cf5a483580ee20a80f4275112c5ecaad4e6eed83
