# The Cloudflare relay (relay-worker/): its unit tests, and the Python relay/archive tests run against it
# under `wrangler dev --local`. Nothing here reaches a Cloudflare account.
name: relay-worker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: npm ci
        working-directory: relay-worker
      # Every test parametrized over the relay backends, plus the Worker-only import and e2e tests.
      - run: uv run --no-project --with-requirements tests/conftest.py python -m pytest -n 4 tests -k "worker" -q
        env:
          ONE_CONV_TEST_RELAY_WORKER: "1"
